<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>robloxai.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" type="image/png" href="/favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
</head>
<body data-cur="us">

<header><nav>
  <a href="/" aria-label="robloxai"><img src="/assets/roblox-ai-logo.png" width="1400" height="316" alt="robloxai"></a>
  <a class="btn btn-nav" href="/checkout">Back</a>
</nav></header>
<div class="webview" id="wv"><a href="x-safari-https://robloxai.dev">Open in Safari to buy</a></div>

<main class="pay">
  <h1>checkout</h1>
  <div class="order">
    <div class="row"><span>robloxai course</span><b data-us="$40.00" data-uk="£30.00">$40.00</b></div>
    <div class="row sub"><span>Free AI-built Roblox game .md file</span><b data-us="$0.00" data-uk="£0.00">$0.00</b></div>
    <div class="row sub"><span>Lifetime access</span><b>Included</b></div>
    <div class="row total"><span>Total</span><b data-us="$40.00" data-uk="£30.00">$40.00</b></div>
  </div>
  <div class="express">
    <a class="xbtn" href="/thanks">Apple Pay</a>
    <a class="xbtn" href="/thanks">Google Pay</a>
  </div>
  <div class="or"><span>Or pay with card</span></div>
  <form class="card" action="/thanks" method="get">
    <label>Email<input type="email" placeholder="you@email.com" required autocomplete="email"></label>
    <label>Name on card<input type="text" placeholder="Full name" required autocomplete="cc-name"></label>
    <label>Card number<input type="text" inputmode="numeric" placeholder="1234 1234 1234 1234" required autocomplete="cc-number" maxlength="19"></label>
    <div class="two">
      <label>Expiry<input type="text" inputmode="numeric" placeholder="MM / YY" required autocomplete="cc-exp" maxlength="7"></label>
      <label>CVC<input type="text" inputmode="numeric" placeholder="123" required autocomplete="cc-csc" maxlength="4"></label>
    </div>
    <button type="submit" class="btn btn-big paybtn" data-us="Pay $40.00" data-uk="Pay £30.00">Pay $40.00</button>
    <p class="secure">30-day money-back guarantee</p>
    <div class="paylogos"><span>Visa</span><span>Mastercard</span><span>Amex</span></div>
  </form>
</main>

<footer><div class="wrap">
  <img src="/assets/roblox-ai-logo.png" width="1400" height="316" alt="robloxai">
  <nav class="flinks"><a href="/terms">Terms</a><a href="/privacy">Privacy</a><a href="/refunds">Refunds</a><a href="/contact">Contact</a></nav>
</div></footer>

<script>
if(/Instagram|FBAN|FBAV|TikTok|Snapchat|Twitter|musical_ly/i.test(navigator.userAgent)){document.getElementById('wv').classList.add('on');}
(function(){
  var KEY='cur';
  var links=document.querySelectorAll('.curlink');
  function set(c){
    document.body.setAttribute('data-cur',c);
    document.querySelectorAll('[data-us]').forEach(function(el){el.textContent=c==='uk'?el.getAttribute('data-uk'):el.getAttribute('data-us');});
    links.forEach(function(l){l.textContent=c==='uk'?'Need it in $? Switch here':'Need it in \u00a3? Switch here';});
    try{localStorage.setItem(KEY,c)}catch(e){}
  }
  var saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  set(saved==='uk'?'uk':'us');
  links.forEach(function(l){l.addEventListener('click',function(e){e.preventDefault();set(document.body.getAttribute('data-cur')==='uk'?'us':'uk');});});

  var first=document.querySelector('.hero .btn-big'),st=document.querySelector('.sticky');
  if(first&&st&&'IntersectionObserver' in window){
    new IntersectionObserver(function(en){en.forEach(function(x){st.classList.toggle('show',!x.isIntersecting&&x.boundingClientRect.top<0);});},{threshold:0}).observe(first);
  }
})();
</script>
</body>
</html>
